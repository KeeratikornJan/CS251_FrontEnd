<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก | BloodBank</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #f3f4f8;
      padding: 40px 16px 60px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 560px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.75rem;
      color: #3b4fa8;
    }

    .brand i { font-size: 2rem; }
    .brand h1 { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
    .brand p  { font-size: .85rem; color: #64748b; font-weight: 400; }

    .section-label {
      font-size: .75rem;
      font-weight: 700;
      color: #3b4fa8;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin: 1.25rem 0 .75rem;
      padding-bottom: .375rem;
      border-bottom: 1px solid #e9edff;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .3rem;
      margin-bottom: .875rem;
    }

    .field label { font-size: .875rem; font-weight: 500; color: #374151; }

    .field input,
    .field select {
      padding: .6rem .875rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-family: inherit;
      font-size: .95rem;
      outline: none;
      background: #fff;
      transition: border-color .15s;
    }

    .field input:focus,
    .field select:focus { border-color: #3b4fa8; }

    .req { color: #ef3b3b; margin-left: 2px; }

    .error-msg {
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      padding: .6rem .875rem;
      font-size: .875rem;
      margin-bottom: .875rem;
      display: none;
    }
    .error-msg.show { display: block; }

    .submit-btn {
      width: 100%;
      padding: .75rem;
      background: #3b4fa8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .75rem;
      transition: background .15s;
    }

    .submit-btn:hover:not(:disabled) { background: #2d3d87; }
    .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      font-size: .875rem;
      color: #64748b;
    }

    .back-link a { color: #3b4fa8; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <i class="fa-solid fa-heart-pulse"></i>
      <div>
        <h1>สมัครสมาชิกผู้บริจาค</h1>
        <p>ระบบธนาคารเลือด BloodBank</p>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="registerForm" novalidate>

      <div class="section-label">ข้อมูลส่วนตัว</div>

      <div class="row-2">
        <div class="field">
          <label for="firstName">ชื่อ <span class="req">*</span></label>
          <input id="firstName" type="text" placeholder="ชื่อ" required />
        </div>
        <div class="field">
          <label for="lastName">นามสกุล <span class="req">*</span></label>
          <input id="lastName" type="text" placeholder="นามสกุล" required />
        </div>
      </div>

      <div class="field">
        <label for="nationalId">เลขบัตรประชาชน (13 หลัก) <span class="req">*</span></label>
        <input id="nationalId" type="text" maxlength="13" placeholder="1234567890123" required />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="gender">เพศ <span class="req">*</span></label>
          <select id="gender" required>
            <option value="">-- เลือก --</option>
            <option value="M">ชาย</option>
            <option value="F">หญิง</option>
          </select>
        </div>
        <div class="field">
          <label for="birthday">วันเกิด <span class="req">*</span></label>
          <input id="birthday" type="date" required />
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="bloodGroup">กรุ๊ปเลือด <span class="req">*</span></label>
          <select id="bloodGroup" required>
            <option value="">-- เลือก --</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="AB">AB</option>
            <option value="O">O</option>
          </select>
        </div>
        <div class="field">
          <label for="rhFactor">Rh Factor <span class="req">*</span></label>
          <select id="rhFactor" required>
            <option value="">-- เลือก --</option>
            <option value="+">Positive (+)</option>
            <option value="-">Negative (-)</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="congenitalDisease">โรคประจำตัว (ถ้ามี)</label>
        <input id="congenitalDisease" type="text" placeholder="เช่น ความดันโลหิตสูง, เบาหวาน" />
      </div>

      <div class="section-label">ข้อมูลติดต่อ</div>

      <div class="row-2">
        <div class="field">
          <label for="phone">เบอร์โทร <span class="req">*</span></label>
          <input id="phone" type="tel" placeholder="0812345678" required />
        </div>
        <div class="field">
          <label for="email">อีเมล <span class="req">*</span></label>
          <input id="email" type="email" placeholder="example@email.com" required />
        </div>
      </div>

      <div class="field">
        <label for="place">ที่อยู่</label>
        <input id="place" type="text" placeholder="ที่อยู่ปัจจุบัน" />
      </div>

      <div class="section-label">ข้อมูลบัญชี</div>

      <div class="field">
        <label for="username">ชื่อผู้ใช้ <span class="req">*</span></label>
        <input id="username" type="text" placeholder="ชื่อผู้ใช้ (3-50 ตัวอักษร)" required minlength="3" maxlength="50" autocomplete="username" />
      </div>

      <div class="row-2">
        <div class="field">
          <label for="password">รหัสผ่าน <span class="req">*</span></label>
          <input id="password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirmPassword">ยืนยันรหัสผ่าน <span class="req">*</span></label>
          <input id="confirmPassword" type="password" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required autocomplete="new-password" />
        </div>
      </div>

      <button class="submit-btn" type="submit" id="submitBtn">
        <i class="fa-solid fa-user-plus"></i>
        สมัครสมาชิก
      </button>
    </form>

    <p class="back-link">มีบัญชีแล้ว? <a href="index.html">เข้าสู่ระบบ</a></p>
  </div>

  <script src="register.js"></script>
</body>
</html>
