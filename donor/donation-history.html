<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation History | Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="donor-style.css">
</head>
<body class="dashboard-body donor-portal">
    <div class="background-animation"></div>

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar donor-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#da292e"/>
                    </svg>
                    <h2 style="margin: 0; font-family: 'Outfit'; font-weight: 700; color: #4a5568;">BloodBank</h2>
                </div>
                <button class="close-sidebar-btn" id="closeSidebarBtn">&times;</button>
            </div>
            <div class="sidebar-menu">
                <a href="donor-portal.html" class="menu-item">
                    <i class="fa-solid fa-table-columns"></i> Dashboard
                </a>
                <a href="donation-history.html" class="menu-item active">
                    <i class="fa-solid fa-history"></i> ประวัติการบริจาค
                </a>
                <a href="donor-profile.html" class="menu-item">
                    <i class="fa-solid fa-user-circle"></i> ข้อมูลส่วนตัว
                </a>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper" id="mainContent">
            <!-- Topbar -->
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div style="flex: 1;"></div>
                <div class="user-profile">
                    <div class="user-info">
                        <div class="user-name" id="topbarName">กำลังโหลด...</div>
                        <div class="user-id" id="topbarId"></div>
                    </div>
                    <button id="logoutBtn" class="logout-btn" style="border: 1px solid var(--primary); background: white; color: var(--primary); border-radius: 8px; padding: 6px 16px; display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer;">
                        <i class="fa-solid fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </header>

            <!-- Content -->
            <main class="dashboard-content">
                <h1 class="page-title">ประวัติการบริจาคโลหิต</h1>

                <div class="table-container" style="border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                    <table class="data-table table-red-header">
                        <thead>
                            <tr>
                                <th>วันที่บริจาค</th>
                                <th>ประเภทการบริจาค</th>
                                <th>ปริมาณ (มล.)</th>
                                <th>ผลการคัดกรอง</th>
                            </tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr><td colspan="4" style="text-align:center; color:#718096; padding:2rem;">
                                <i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลด...
                            </td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="giftSummary" class="gift-summary-card" style="display:none;">
                    <div class="gift-icon">
                        <i class="fa-solid fa-gift"></i>
                    </div>
                    <h3 id="giftTotal" style="margin-bottom: 0.5rem; color: #4a5568; font-size: 1.5rem; font-family: 'Outfit'; font-weight: 700;">ยอดบริจาคสะสม : 0 ครั้ง</h3>
                    <p style="color: #718096; font-style: italic;">" ขอบคุณที่ร่วมเป็นส่วนหนึ่งในการต่อชีวิตเพื่อนมนุษย์ "</p>
                </div>
            </main>
        </div>
    </div>

    <script src="../api.js"></script>
    <script>
        const user = getAuthUser();
        document.getElementById('topbarName').textContent = user?.fullName ? `คุณ${user.fullName}` : (user?.username || 'ผู้บริจาค');
        document.getElementById('topbarId').textContent = user?.id ? `DON-${String(user.id).padStart(5, '0')}` : '';

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            window.location.replace("../index.html");
        });

        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        if (menuToggle && sidebar) menuToggle.addEventListener('click', () => sidebar.classList.toggle('active'));
        if (closeSidebarBtn && sidebar) closeSidebarBtn.addEventListener('click', () => sidebar.classList.remove('active'));

        async function loadHistory() {
            const tbody = document.getElementById('historyBody');
            try {
                const rows = await apiGet('/api/donors/me/donations');
                if (!rows || rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#718096; padding:2rem;">ยังไม่มีประวัติการบริจาค</td></tr>';
                    return;
                }
                tbody.innerHTML = rows.map(r => `
                    <tr>
                        <td>${r.donationDate ? formatThaiDate(r.donationDate) : '—'}</td>
                        <td>${r.donationType || '—'}</td>
                        <td>${r.volume ?? '—'}</td>
                        <td><span class="badge-donor-${r.screeningResult === 'ผ่าน' ? 'pass' : 'fail'}">${r.screeningResult || '—'}</span></td>
                    </tr>
                `).join('');

                const giftSummary = document.getElementById('giftSummary');
                document.getElementById('giftTotal').textContent = `ยอดบริจาคสะสม : ${rows.length} ครั้ง`;
                giftSummary.style.display = 'block';
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#e53e3e; padding:2rem;">ไม่สามารถโหลดข้อมูลได้: ${err.message}</td></tr>`;
            }
        }

        loadHistory();
    </script>
</body>
</html>
