<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration | Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="donor-style.css">
</head>
<body class="donor-portal">
    <div class="background-animation"></div>

    <main class="container" style="max-width: 900px; padding: 2rem 1rem;">
        <div class="stat-card" style="padding: 3rem; text-align: left; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-color: #f1f1f1;">
            <div style="text-align: center; margin-bottom: 3rem;">
                <h1 style="font-size: 2.5rem; font-family: 'Outfit'; font-weight: 700; color: #4a5568;">Donor <span style="color: var(--primary);">Registration</span></h1>
                <p style="margin-bottom: 0; color: #718096; font-size: 1.1rem;">ลงทะเบียนเพื่อเริ่มต้นส่งต่อสายโลหิต</p>
            </div>

            <div id="errorMsg" class="alert alert-error"></div>

            <div id="successOutput" class="auth-success-output">
                <i class="fa-solid fa-circle-check"></i>
                <h2 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--text-main);">ลงทะเบียนสำเร็จ!</h2>
                <p style="font-size: 1.1rem; color: #38a169; font-weight: 600;">กำลังเข้าสู่ระบบ...</p>
            </div>

            <form id="registerForm" class="form-container" novalidate>
                <h3 style="color: var(--primary); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e2e8f0;">ข้อมูลส่วนตัว</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">ชื่อ <span style="color:var(--primary)">*</span></label>
                        <input type="text" id="firstName" class="form-control" placeholder="ชื่อ" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">นามสกุล <span style="color:var(--primary)">*</span></label>
                        <input type="text" id="lastName" class="form-control" placeholder="นามสกุล" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">เลขบัตรประชาชน (13 หลัก) <span style="color:var(--primary)">*</span></label>
                        <input type="text" id="nationalId" class="form-control" placeholder="1234567890123" maxlength="13" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">ชื่อผู้ใช้ <span style="color:var(--primary)">*</span></label>
                        <input type="text" id="username" class="form-control" placeholder="ชื่อผู้ใช้ (3-50 ตัวอักษร)" required minlength="3" maxlength="50" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label class="form-label">เพศ <span style="color:var(--primary)">*</span></label>
                        <select id="gender" class="form-control" required>
                            <option value="">-- เลือกเพศ --</option>
                            <option value="M">ชาย</option>
                            <option value="F">หญิง</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">วันเกิด <span style="color:var(--primary)">*</span></label>
                        <input type="date" id="birthday" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">เบอร์โทรศัพท์ <span style="color:var(--primary)">*</span></label>
                        <input type="tel" id="phone" class="form-control" placeholder="08x-xxx-xxxx" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">อีเมล <span style="color:var(--primary)">*</span></label>
                        <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">ที่อยู่</label>
                        <textarea id="place" class="form-control" placeholder="บ้านเลขที่, หมู่, ซอย, ถนน, ตำบล, อำเภอ, จังหวัด, รหัสไปรษณีย์"></textarea>
                    </div>
                </div>

                <h3 style="color: var(--primary); margin: 2rem 0 1rem 0; padding-bottom: 0.5rem; border-bottom: 1px solid #e2e8f0;">ข้อมูลสุขภาพและการเข้าสู่ระบบ</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">กรุ๊ปเลือด (Blood Group) <span style="color:var(--primary)">*</span></label>
                        <select id="bloodGroup" class="form-control" required>
                            <option value="">-- เลือกกรุ๊ปเลือด --</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="AB">AB</option>
                            <option value="O">O</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Rh Factor <span style="color:var(--primary)">*</span></label>
                        <select id="rhFactor" class="form-control" required>
                            <option value="">-- เลือก Rh --</option>
                            <option value="+">Positive (+)</option>
                            <option value="-">Negative (-)</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">โรคประจำตัว (หากไม่มี โปรดระบุ "ไม่มี")</label>
                        <input type="text" id="congenitalDisease" class="form-control" placeholder="โปรดระบุโรคประจำตัว">
                    </div>
                    <div class="form-group">
                        <label class="form-label">รหัสผ่าน <span style="color:var(--primary)">*</span></label>
                        <input type="password" id="password" class="form-control" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label class="form-label">ยืนยันรหัสผ่าน <span style="color:var(--primary)">*</span></label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required autocomplete="new-password">
                    </div>

                    <div style="display: flex; justify-content: center; margin-top: 2rem; grid-column: 1 / -1;">
                        <button type="submit" id="submitBtn" class="btn btn-donor" style="width: 100%; max-width: 400px; background: #da292e; color: white; border: none; padding: 1.2rem; border-radius: 16px; box-shadow: 0 8px 20px rgba(218, 41, 46, 0.3);">
                            <span style="font-size: 1.5rem; font-weight: 700;">ลงทะเบียน</span>
                        </button>
                    </div>
                </div>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <p style="color: #718096; font-size: 1rem;">
                    มีบัญชีแล้ว?
                    <a href="donor-login.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">เข้าสู่ระบบ</a>
                </p>
            </div>
        </div>
    </main>

    <script src="register.js"></script>
</body>
</html>
